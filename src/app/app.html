<main class="container">
  <h1>Minhas tarefas</h1>

  <!-- Campo de entrada e botão para adicionar -->
  <div class="input-container">
    <input 
      type="text" 
      [(ngModel)]="novaTarefaTexto" 
      placeholder="Digite uma nova tarefa..." 
      (keyup.enter)="adicionarTarefa()"
    />
    <button (click)="adicionarTarefa()" class="btn-adicionar">Adicionar</button>
  </div>

  <!-- Lista de tarefas (*ngFor) -->
  <ul class="lista-tarefas">
    <li *ngFor="let item of tarefas; let i = index" class="tarefa-item">
      <input 
        type="checkbox" 
        [checked]="item.concluida" 
        (change)="item.concluida = !item.concluida" 
      />

      <span [class.riscado]="item.concluida" class="descricao">
        {{ item.descricao }}
      </span>

      <button (click)="removerTarefa(i)" class="btn-remover">Remover</button>
    </li>
  </ul>

  <!-- Contador dinâmico -->
  <footer class="rodape">
    <p>Tarefas concluídas: <strong>{{ totalConcluidas }}</strong></p>
  </footer>
</main>
